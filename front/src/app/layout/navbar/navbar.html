<nav class="app-navbar">

  <div class="d-flex align-items-center gap-2">

    <button
      class="btn btn-outline-secondary btn-sm d-lg-none"
      type="button"
      (click)="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

    <span class="brand">
      <i class="bi bi-buildings"></i>
      {{ 'APP.NAME' | translate }}
    </span>

  </div>

  <div class="d-flex align-items-center gap-2">

    <button
      class="btn btn-sm"
      [class.btn-primary]="currentLanguage() === 'ar'"
      [class.btn-outline-primary]="currentLanguage() !== 'ar'"
      (click)="changeLanguage('ar')">
      العربية
    </button>

    <button
      class="btn btn-sm"
      [class.btn-primary]="currentLanguage() === 'en'"
      [class.btn-outline-primary]="currentLanguage() !== 'en'"
      (click)="changeLanguage('en')">
      English
    </button>

    <button
      class="btn btn-outline-secondary btn-sm"
      (click)="changeRole()">
      <i class="bi bi-person-badge"></i>
      {{ ('ROLE.' + currentRole()) | translate }}
      <i class="bi bi-arrow-left-right"></i>
    </button>

  </div>

</nav>
